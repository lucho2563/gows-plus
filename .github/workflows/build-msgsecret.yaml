name: Build gows-amd64 (message-secret)

# Fork-only workflow. Builds the same Dockerfile as upstream build.yaml
# (golang bookworm builder, make all) for linux/amd64 and publishes the
# binary as a release asset of this fork, using only the built-in GITHUB_TOKEN.
on:
  push:
    branches:
      - message-secret
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.49-msgsecret

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build (same Dockerfile as upstream)
        run: docker build -t gows .

      - name: Extract binary
        run: |
          docker create --name temp-gows gows
          mkdir -p release
          docker cp temp-gows:/release/gows ./release/gows-amd64
          docker rm temp-gows
          chmod +x release/gows-amd64
          ls -l release/gows-amd64
          file release/gows-amd64 || true
          sha256sum release/gows-amd64 | tee release/gows-amd64.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/gows-amd64 release/gows-amd64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "gows-plus v1.0.49 plus MessageSecret on outgoing messages (whatsmeow#509). linux/amd64 only. Built from commit $GITHUB_SHA."
